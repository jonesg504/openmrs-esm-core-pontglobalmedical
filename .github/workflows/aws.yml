name: Build & Deploy OpenMRS Frontend (esm-core)

on:
  workflow_dispatch:  # Manual trigger only — run from GitHub Actions UI

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'
  FRONTEND_DIR: '/home/ubuntu/openmrs/server/frontend'
  BACKUP_DIR: '/home/ubuntu/frontend-backups'

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build the frontend bundle
  # ─────────────────────────────────────────────
  build:
    name: Build esm-core Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout openmrs-esm-core fork
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (for yarn)
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn turbo build --filter=@openmrs/esm-app-shell...

      - name: Find built output
        id: find-output
        run: |
          BUILD_DIR="packages/shell/esm-app-shell/dist"
          echo "Contents of build dir:"
          ls -la "$BUILD_DIR"

          # Find the main JS bundle (openmrs.*.js)
          MAIN_JS=$(ls "$BUILD_DIR"/openmrs.*.js | grep -v map | head -1)
          MAIN_JS_NAME=$(basename "$MAIN_JS")
          echo "Main bundle: $MAIN_JS_NAME"
          echo "main_js=$MAIN_JS" >> $GITHUB_OUTPUT
          echo "main_js_name=$MAIN_JS_NAME" >> $GITHUB_OUTPUT
          echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT
      - name: Upload build output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/shell/esm-app-shell/dist
          retention-days: 5

      - name: Save main JS filename for deploy job
        run: echo "${{ steps.find-output.outputs.main_js_name }}" > main_js_name.txt

      - name: Upload filename artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-js-name
          path: main_js_name.txt

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to EC2 via SSM + S3
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Download main JS filename
        uses: actions/download-artifact@v4
        with:
          name: main-js-name

      - name: Read main JS filename
        id: read-name
        run: |
          MAIN_JS_NAME=$(cat main_js_name.txt)
          echo "main_js_name=$MAIN_JS_NAME" >> $GITHUB_OUTPUT
          echo "Deploying bundle: $MAIN_JS_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/pontmedical-openmrs-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build to S3
        run: |
          echo "→ Uploading frontend bundle to S3..."
          aws s3 cp dist/ s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend-deploy/ \
            --recursive \
            --exclude "*.map"
          echo "✓ Uploaded to S3"

      - name: Deploy frontend via SSM
        run: |
          MAIN_JS_NAME="${{ steps.read-name.outputs.main_js_name }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "OpenMRS frontend deploy" \
            --timeout-seconds 300 \
            --parameters "commands=[
              \"set -e\",
              \"echo === Starting frontend deploy ===\",
              \"TIMESTAMP=\$(date +%Y%m%d_%H%M%S)\",
              \"FRONTEND_DIR=${{ env.FRONTEND_DIR }}\",
              \"BACKUP_DIR=${{ env.BACKUP_DIR }}/\${TIMESTAMP}\",

              \"echo → Backing up current index.html and main JS bundle...\",
              \"mkdir -p \${BACKUP_DIR}\",
              \"cp \${FRONTEND_DIR}/index.html \${BACKUP_DIR}/index.html.bak\",
              \"CURRENT_JS=\$(grep -oP 'openmrs\\\\.[a-f0-9]+\\\\.js' \${FRONTEND_DIR}/index.html | head -1)\",
              \"echo Current bundle: \${CURRENT_JS}\",
              \"[ -f \${FRONTEND_DIR}/\${CURRENT_JS} ] && cp \${FRONTEND_DIR}/\${CURRENT_JS} \${BACKUP_DIR}/\${CURRENT_JS}.bak || true\",
              \"echo → Backup saved to \${BACKUP_DIR}\",

              \"echo → Syncing new frontend files from S3...\",
              \"aws s3 sync s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend-deploy/ \${FRONTEND_DIR}/ --exclude '*.map'\",

              \"echo → Updating index.html to reference new bundle: ${MAIN_JS_NAME}...\",
              \"OLD_JS=\$(grep -o 'openmrs\\.[a-f0-9]*\\.js' \${FRONTEND_DIR}/index.html | head -1)\",
              \"echo Old bundle was: \${OLD_JS}\",
              \"sed -i 's|'\${OLD_JS}'|${MAIN_JS_NAME}|g' \${FRONTEND_DIR}/index.html\",
              \"echo → Verifying index.html references new bundle...\",
              \"grep -o 'openmrs\\.[a-f0-9]*\\.js' \${FRONTEND_DIR}/index.html\",

              \"echo → Pruning old backups...\",
              \"ls -dt ${{ env.BACKUP_DIR }}/*/ 2>/dev/null | awk 'NR>5' | xargs rm -rf || true\",
              \"echo === Frontend deploy complete ===\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for result
          for i in {1..20}; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: Status = $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✓ Frontend deployed successfully"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "✗ Deploy failed with status: $STATUS"
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done

          echo "✗ Timed out waiting for deploy"
          exit 1

      - name: Health check
        run: |
          echo "→ Checking OpenMRS is still responding..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "http://${{ secrets.EC2_HOST }}:8080/openmrs/spa/" || echo "000")
          echo "→ HTTP response: $HTTP_CODE"
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
            echo "✓ OpenMRS SPA is responding"
          else
            echo "⚠ Health check returned $HTTP_CODE — check manually"
            echo "  Rollback if needed: see instructions below"
          fi

      - name: Cleanup S3 staging
        if: always()
        run: |
          aws s3 rm s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend-deploy/ --recursive || true

      - name: Print rollback instructions
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  ROLLBACK INSTRUCTIONS (if needed)"
          echo "════════════════════════════════════════"
          echo "SSH or Session Manager into EC2, then:"
          echo ""
          echo "  BACKUP=\$(ls -dt /home/ubuntu/frontend-backups/*/ | head -1)"
          echo "  cp \${BACKUP}/index.html.bak /home/ubuntu/openmrs/server/frontend/index.html"
          echo "  OLD_JS=\$(ls \${BACKUP}/*.js.bak | head -1 | sed 's/.bak//')"
          echo "  cp \${BACKUP}/\$(basename \${OLD_JS}).bak \${OLD_JS}"
          echo ""
          echo "  That restores the previous bundle and index.html instantly."
          echo "════════════════════════════════════════"
